# LOCAL, not an InferenceX-committed curve. Acceptance Length (AL) measured with SPEED-Bench.
# dataset: coding (80 prompts) | temperature: 1.0 | top_p: 0.95 | output_len: 4096 | conc: 32
# thinking_on: chat template default (generation prompt opens <think>)
# verify: target (SGLang CUDA default, target-only)
# Measured on nvidia/GLM-5.3-Flash-NVFP4 (dgx-023, NVIDIA B200 TP4, SGLang 0.5.22, EAGLE topk 1), 2026-10-30.
# Generated by SGLang-benchmarks/Agentic/speedbench_glm53flash_b200_sglang.sh
#
# This is the curve ix_agentx_glm53flash.sh simulates by default, on both chips.
# Target-only (SGLang's CUDA default verify) was picked as the standard.
# glm5.3flash_mtp_rs.yaml is the same run with rejection sampling, kept for
# reference only.
#
# key = num_speculative_tokens (MTP steps); value = golden AL
glm-5.3-flash:
  thinking_on:
    3: 2.99
    4: 3.34
    5: 3.56
